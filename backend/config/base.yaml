# AutoOps application configuration. Keep secrets in a local untracked file or environment variables.
server:
  host: localhost
  port: 8819
embedding:
  provider: openai
  model: text-embedding-3-small
  dimension: 1536
  base_url: https://api.openai.com/v1
  api_key: ""
  timeout: 30s
  batch_size: 32
  max_retries: 2
  normalize: true
qdrant:
  host: 127.0.0.1
  port: 6334
  collection: autoops
openai:
  api_key: ""
  model: minimax/minimax-m2.1
  api_base: https://api.qnaigc.com/v1
log:
  level: info
  file: log/AutoOps.log
